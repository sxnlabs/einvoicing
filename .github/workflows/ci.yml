name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

# Un push qui en remplace un autre annule le run precedent : la CI ne paie pas
# deux fois pour un etat de branche qui n'existe plus.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # bundler-cache lance un `bundle install` non gele : sans ca il reecrit le
  # lock silencieusement, et les jobs valident un lock qui n'est pas celui du
  # depot. Un lock perime peut alors vivre indefiniment sur master.
  BUNDLE_FROZEN: "true"
  DEBIAN_FRONTEND: noninteractive

jobs:
  # Le plancher declare par le gemspec et le Ruby courant. Les deux bords, pas
  # la fenetre complete : c'est la que les incompatibilites se manifestent, et
  # chaque job supplementaire se paie.
  test:
    name: Tests (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "4.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rspec
        env:
          # Un seul leg porte le seuil de couverture, voir spec/spec_helper.rb.
          COVERAGE_GATE: ${{ matrix.ruby == '4.0' && '1' || '0' }}

  # RuboCop ne depend pas de la version de Ruby qui l'execute : un seul job.
  lint:
    name: RuboCop
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - run: bundle exec rubocop --format github

  audit:
    name: Vulnerabilites des dependances
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - run: bundle exec bundle-audit check --update

  # `bundle update` resout contre le Ruby de la machine qui le lance. Sur un
  # poste en 4.0 il choisit sans broncher une gem qui exige >= 3.3, et le lock
  # committe devient ininstallable sur le plancher declare. Ni les tests ni le
  # linter ne le voient : ils tournent sur le Ruby qui va bien.
  lock:
    name: Lock installable sur le plancher Ruby
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - run: bundle exec ruby script/check_lock_ruby.rb --project .

  # Le vrai test d'empaquetage : la gem installee dans un bundle qui ne contient
  # qu'elle. Le spec de packaging lit lib/ et attrape les require non declares
  # meme quand ils dorment dans un corps de methode ; ce job prouve en plus que
  # ce qui en sort s'installe et se charge. Les deux sont complementaires.
  isolation:
    name: Chargement en bundle isole (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "4.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - run: ruby script/check_isolated_load.rb --project .

  # Le seul job qui valide le produit fini plutot que le code : Mustang lit le
  # PDF/A-3 et le XML Factur-X comme le ferait un destinataire. Une seule fois,
  # il telecharge 56 Mo et demande une JVM.
  facturx:
    name: Validation Factur-X (Mustang)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Cache Mustang CLI jar
        id: cache-mustang
        uses: actions/cache@v4
        with:
          path: mustang-cli.jar
          key: mustang-cli-2.22.0
      - name: Download Mustang CLI
        if: steps.cache-mustang.outputs.cache-hit != 'true'
        run: |
          curl -L https://github.com/ZUGFeRD/mustangproject/releases/download/core-2.22.0/Mustang-CLI-2.22.0.jar \
            -o mustang-cli.jar
      - name: Install system fonts
        run: sudo apt-get install -y fonts-dejavu-core
      - name: Generate sample invoice
        run: bundle exec ruby scripts/generate_sample.rb
      - name: Validate Factur-X PDF
        run: |
          OUTPUT=$(java -jar mustang-cli.jar --action validate --source /tmp/sample-invoice.pdf)
          echo "$OUTPUT"
          # Echec sur non-conformite PDF/A-3 ou erreur de schema XML. Les avis
          # allemands XRechnung (BR-DE-*) ne concernent pas le Factur-X francais.
          if echo "$OUTPUT" | grep -q 'PDF:invalid'; then
            echo "PDF/A-3 conformance validation failed"
            exit 1
          fi
          if echo "$OUTPUT" | grep -q 'XML:invalid'; then
            echo "Factur-X XML validation failed"
            exit 1
          fi
          echo "Factur-X PDF/A-3 and XML validation passed"
